<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>Sign in | POSTiT</title>
    <link rel="stylesheet" href="../css/main.css">
    <script>
      (() => {
        const saved = localStorage.getItem("postit-theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" src="../js/pages/login.js"></script>
  </head>
  <body class="auth-entry">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" data-sidebar aria-label="Sidebar navigation"></aside>
      <div class="app-main">
        <header class="topbar" data-topbar></header>
        <main class="page-content auth-page" id="main-content">
          <section class="auth-panel">
            <div class="auth-brand"><a href="../index.html" class="brand"><span class="brand-mark">P</span><span>POSTiT</span></a><button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme"></button></div>
            <div class="auth-wrap">
              <span class="eyebrow auth-eyebrow">Welcome back</span>
              <h1>Sign in to POSTiT</h1>
              <p class="auth-subtitle">Continue sharing moments with your community.</p>
              <form class="auth-form" id="login-form" novalidate>
                <label class="field"><span class="field-label">Email or username</span><input name="identifier" autocomplete="username" required placeholder="maya@example.com"></label>
                <div class="field"><label for="login-password">Password</label><div class="password-control"><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Enter your password"><button type="button" data-toggle-password aria-label="Show password" aria-pressed="false">Show</button></div></div>
                <div class="auth-options"><label><input type="checkbox" name="remember"> Remember me</label><button class="text-link" type="button" data-unavailable="Password reset">Forgot password?</button></div>
                <p class="form-error" id="form-message" role="alert"></p>
                <button class="button button-primary button-wide" type="submit">Sign in</button>
              </form>
              <p class="auth-switch">New to POSTiT? <a href="register.html">Create an account</a></p>
            </div>
            <small class="auth-footnote">© 2026 POSTiT. Built by <a href="https://shoaibsikderportfolio.vercel.app" target="_blank" rel="noopener noreferrer"><span>Md. Shoaib Sikder</span></a>.</small>
          </section>
          <aside class="auth-visual" aria-label="A welcoming note">
            <div class="auth-quote">
              <blockquote>“The best moments become better when they’re shared.”</blockquote>
              <p>A focused social space for the people and stories that matter.</p>
            </div>
          </aside>
        </main>
      </div>
      <nav class="mobile-nav" data-mobile-nav aria-label="Mobile navigation"></nav>
    </div>
  </body>
</html>
