<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Home | POSTiT</title>
  <link rel="stylesheet" href="../css/main.css">
  <script>
    (() => {
      const saved = localStorage.getItem("postit-theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
  <script type="module" src="../js/pages/feed.js"></script>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar aria-label="Sidebar navigation"></aside>
    <div class="app-main">
      <header class="topbar" data-topbar></header>
      <main class="page-content" id="main-content">
        <header class="page-heading feed-page-heading">
          <div><span class="eyebrow">Your space</span>
            <h1 id="feed-greeting">Your feed</h1>
          </div>
          <span class="feed-status muted" id="feed-status" role="status">Loading your feed…</span>
        </header>
        <div class="feed-layout">
          <section class="feed-main" aria-label="Your feed">
            <form class="composer-card" id="composer">
              <div class="composer-top">
                <div data-current-avatar></div>
                <label class="sr-only" for="post-content"></label>
                <textarea class="composer-textarea" id="post-content" name="content" maxlength="2000"
                  placeholder="What’s on your mind?" aria-describedby="composer-error"></textarea>
              </div>
              <div class="composer-preview" id="image-preview" hidden></div>
              <p class="form-error" id="composer-error" role="alert"></p>
              <div class="composer-bottom">
                <div class="composer-tools">
                  <label class="composer-file-label"><svg class="icon" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                      aria-hidden="true">
                      <rect x="3" y="3" width="18" height="18" rx="3" />
                      <circle cx="8.5" cy="8.5" r="1.5" />
                      <path d="m21 15-5-5L5 21" />
                    </svg><span>Add photos</span><input id="post-images" type="file"
                      accept="image/jpeg,image/png,image/webp" multiple></label>
                  <span class="composer-count" id="post-count">0 / 2,000</span>
                </div>
                <button class="button button-primary" id="post-submit" type="submit">Post</button>
              </div>
            </form>
            <div class="feed-list" id="feed-list">
              <div class="loading-state"><span class="spinner" aria-hidden="true"></span>Gathering your feed…</div>
            </div>
            <div class="pagination" id="feed-pagination"></div>
          </section>
          <aside class="feed-column" aria-label="Your account and community">
            <section class="side-card mini-profile" id="feed-profile-card">
              <div class="mini-cover"></div>
              <div class="mini-profile-content">
                <div data-mini-profile-avatar></div>
                <strong data-mini-profile-name></strong>
                <span class="muted" data-mini-profile-username></span>
                <p class="mini-profile-bio" data-mini-profile-bio></p>
                <div class="profile-counts" data-mini-profile-counts></div>
                <a class="button button-secondary button-wide" href="profile.html">View profile</a>
              </div>
            </section>
            <section class="side-card">
              <div class="section-heading">
                <h2>People you may know</h2><a class="text-link" href="search.html">See all</a>
              </div>
              <div class="people-suggestions" id="people-suggestions">
                <div class="loading-state">Discovering people…</div>
              </div>
            </section>
          </aside>
        </div>
      </main>
    </div>
    <nav class="mobile-nav" data-mobile-nav aria-label="Mobile navigation"></nav>
  </div>
</body>

</html>
